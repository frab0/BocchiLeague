name: Notifica articolo Gazzetta (App Push + Telegram in pausa)

# Parte quando cambia notifica_articoli.txt su pos_branch.
# Se c'è un link a un articolo della Gazzetta (#gazzetta-STAGIONE-GIORNATA), aspetta che sia online.
# Altrimenti (qualsiasi altro link o nessun link) invia subito la notifica.

on:
  push:
    branches:
      - pos_branch
    paths:
      - 'notifica_articoli.txt'

jobs:
  controlla-e-notifica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file aggiornati
        uses: actions/checkout@v4

      - name: Controlla e invia le notifiche
        env:
          # Le variabili Telegram restano qui pronte (non inviano nulla finché il blocco sotto è commentato)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          if [ ! -f notifica_articoli.txt ] || [ -z "$(tr -d '[:space:]' < notifica_articoli.txt)" ]; then
            echo "notifica_articoli.txt è vuoto: niente da inviare"
            exit 0
          fi

          # Controlla se è presente un link specifico di un articolo della Gazzetta
          SITO=$(grep -o 'https://[^#[:space:]]*' notifica_articoli.txt | head -1 || true)
          ID=$(grep -o '#gazzetta-[0-9]*-[0-9]*-[0-9]*' notifica_articoli.txt | head -1 | sed 's/#gazzetta-//' || true)
          # I pronostici hanno il link che finisce con -pronostici, gli articoli del dopo-partita no
          TIPO=cronaca
          if grep -q '#gazzetta-[0-9]*-[0-9]*-[0-9]*-pronostici' notifica_articoli.txt; then TIPO=pronostici; fi

          if [ -n "$SITO" ] && [ -n "$ID" ]; then
            STAGIONE=${ID%-*}
            GIORNATA=${ID##*-}
            echo "Aspetto che l'articolo ($TIPO) della giornata $GIORNATA ($STAGIONE) sia online su $SITO"

            ONLINE=0
            for i in $(seq 1 40); do
              if curl -sf "${SITO}data/gazzetta.json?t=$(date +%s)" \
                | jq -e --arg s "$STAGIONE" --argjson g "$GIORNATA" --arg t "$TIPO" \
                    'any(.[]; .stagione == $s and .giornata == $g and ((.tipo // "cronaca") == $t))' > /dev/null; then
                ONLINE=1
                break
              fi
              sleep 30
            done

            if [ "$ONLINE" -ne 1 ]; then
              echo "Dopo 20 minuti l'articolo non è ancora online: notifica non inviata"
              exit 1
            fi
          fi

          echo "Invio le notifiche!"

          # =========================================================================
          # ⏸️ TELEGRAM IN PAUSA (NOTIFICHE DISATTIVATE)
          # Per riattivare Telegram, TOGLI IL "#" SOLO ALLE 3 RIGHE QUI SOTTO:
          # =========================================================================
          # curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          #   -d "chat_id=$TELEGRAM_CHAT_ID" \
          #   --data-urlencode "text@notifica_articoli.txt"
          # =========================================================================

          # Invio Notifica Push sull'App (OneSignal)
          PAYLOAD=$(python3 -c '
          import json, os

          with open("notifica_articoli.txt", "r", encoding="utf-8") as f:
              righe = [r.rstrip("\r\n") for r in f.readlines()]

          # Rimuove eventuali righe vuote in cima e in fondo
          while righe and not righe[0].strip():
              righe.pop(0)
          while righe and not righe[-1].strip():
              righe.pop()

          url_default = "https://frab0.github.io/BocchiLeague/"
          url = url_default

          # Se l'\''ultima riga è un link, la usa come URL della push e la toglie dal corpo del testo
          if righe and (righe[-1].strip().startswith("http://") or righe[-1].strip().startswith("https://")):
              url = righe.pop().strip()
              while righe and not righe[-1].strip():
                  righe.pop()

          titolo = righe[0].strip() if righe else "Bocchi League"
          testo = "\n".join(righe[1:]).strip() if len(righe) > 1 else "Apri l'\''app per leggere le novità!"

          data = {
              "app_id": os.environ["ONESIGNAL_APP_ID"],
              "included_segments": ["All"],
              "headings": {"en": titolo, "it": titolo},
              "contents": {"en": testo, "it": testo},
              "url": url,
              "priority": 10
          }
          print(json.dumps(data))
          ')

          curl -f -X POST https://api.onesignal.com/notifications \
            -H "Content-Type: application/json" \
            -H "Authorization: Key $ONESIGNAL_API_KEY" \
            -d "$PAYLOAD"
