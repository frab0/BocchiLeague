name: Notifica articolo Gazzetta (Telegram + App Push)

# Parte quando cambia notifica_articoli.txt su pos_branch, ma manda i messaggi solo
# quando l'articolo collegato è davvero online sul sito.

on:
  push:
    branches:
      - pos_branch
    paths:
      - 'notifica_articoli.txt'

jobs:
  controlla-e-notifica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file aggiornati
        uses: actions/checkout@v4

      - name: Aspetta che l'articolo sia online e invia le notifiche
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          if [ ! -f notifica_articoli.txt ] || [ -z "$(tr -d '[:space:]' < notifica_articoli.txt)" ]; then
            echo "notifica_articoli.txt è vuoto: niente da inviare"
            exit 0
          fi

          # Dal link nel file ricava indirizzo del sito, stagione e giornata
          # (es. https://frab0.github.io/BocchiLeague/#gazzetta-26-27-10)
          SITO=$(grep -o 'https://[^#[:space:]]*' notifica_articoli.txt | head -1)
          ID=$(grep -o '#gazzetta-[0-9]*-[0-9]*-[0-9]*' notifica_articoli.txt | head -1 | sed 's/#gazzetta-//')
          LINK_COMPLETO=$(grep -o 'https://[^[:space:]]*' notifica_articoli.txt | head -1)

          if [ -z "$SITO" ] || [ -z "$ID" ]; then
            echo "Nel file manca il link all'articolo (…/#gazzetta-STAGIONE-GIORNATA)"
            exit 1
          fi
          STAGIONE=${ID%-*}
          GIORNATA=${ID##*-}
          echo "Aspetto che l'articolo della giornata $GIORNATA ($STAGIONE) sia online su $SITO"

          # Controlla ogni 30 secondi, per al massimo 20 minuti
          for i in $(seq 1 40); do
            if curl -sf "${SITO}data/gazzetta.json?t=$(date +%s)" \
              | jq -e --arg s "$STAGIONE" --argjson g "$GIORNATA" \
                  'any(.[]; .stagione == $s and .giornata == $g)' > /dev/null; then
              echo "Articolo online: invio le notifiche!"

              # 1. Invio su Telegram
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
                -d "chat_id=$TELEGRAM_CHAT_ID" \
                --data-urlencode "text@notifica_articoli.txt"

              # 2. Preparazione dati e invio Notifica Push sull'App (OneSignal)
              TITOLO=$(grep -v '^[[:space:]]*$' notifica_articoli.txt | sed -n '1p' | tr -d '\r')
              TESTO=$(grep -v '^[[:space:]]*$' notifica_articoli.txt | sed -n '2p' | tr -d '\r')
              # Se il file ha solo 1 riga oltre al link, usa un testo di riserva
              if [ -z "$TESTO" ] || [[ "$TESTO" == http* ]]; then
                TESTO="Leggi il nuovo articolo della Gazzetta!"
              fi

              PAYLOAD=$(python3 -c '
              import json, os, sys
              data = {
                  "app_id": os.environ["ONESIGNAL_APP_ID"],
                  "included_segments": ["All"],
                  "headings": {"en": sys.argv[1], "it": sys.argv[1]},
                  "contents": {"en": sys.argv[2], "it": sys.argv[2]},
                  "url": sys.argv[3]
              }
              print(json.dumps(data))
              ' "$TITOLO" "$TESTO" "$LINK_COMPLETO")

              curl -f -X POST https://api.onesignal.com/notifications \
                -H "Content-Type: application/json" \
                -H "Authorization: Key $ONESIGNAL_API_KEY" \
                -d "$PAYLOAD"

              exit 0
            fi
            sleep 30
          done

          echo "Dopo 20 minuti l'articolo non è ancora online: notifica non inviata"
          exit 1